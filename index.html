<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Login & Calendar</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #6a11cb, #2575fc);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        padding: 25px;
        width: 350px;
        border-radius: 15px;
        box-shadow: 0 0 12px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 90%;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid gray;
        margin-bottom: 20px;
    }

    button {
        width: 95%;
        padding: 10px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #2575fc;
        color: white;
    }

    button:hover {
        background-color: #0d47a1;
    }

    .calendar {
        margin-top: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #2575fc;
        color: white;
        padding: 8px;
    }

    td {
        padding: 10px;
        border: 1px solid #ddd;
    }

    .highlight {
        background: #6a11cb;
        color: white;
        font-weight: bold;
        border-radius: 6px;
    }

    .infoText {
        margin-top: 10px;
        font-size: 15px;
        font-weight: bold;
        color: #333;
    }

    .wishText {
        color: #ff007f;
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
    }

    /* Back Button */
    #backBtn {
        margin-top: 20px;
        background-color: #444;
    }

    #backBtn:hover {
        background-color: #000;
    }
</style>

</head>
<body>

<div class="container" id="loginPage">
    <h2>Login With Your Date of Birth</h2>
    <input type="date" id="dob">
    <button onclick="login()">Login</button>
</div>

<div class="container" id="calendarPage" style="display:none;">
    <h2>Your Birthday Calendar</h2>

    <p id="birthdayInfo" style="font-weight:bold; color:#2575fc;"></p>

    <p id="ageResult" class="infoText"></p>
    <p id="daysSurvived" class="infoText"></p>
    <p id="liveTimer" class="infoText"></p>
    <p id="wish" class="wishText"></p>

    <div class="calendar" id="calendar"></div>

    <!-- BACK BUTTON ADDED -->
    <button id="backBtn" onclick="goBack()">Back</button>
</div>

<script>
function login() {
    let dobInput = document.getElementById("dob").value;

    if (dobInput === "") {
        alert("Please select your Date of Birth");
        return;
    }

    let dob = new Date(dobInput);
    let bDay = dob.getDate();
    let bMonth = dob.getMonth();
    let dayName = dob.toLocaleString('en-us', { weekday: 'long' });

    document.getElementById("birthdayInfo").innerHTML =
        "Your Birthday: " + dobInput + "<br>Day: " + dayName;

    generateCalendar(bMonth, bDay);

    showAge(dob);
    showDaysSurvived(dob);
    startLiveTimer(dob);
    birthdayWish(dob);

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("calendarPage").style.display = "block";
}

function showAge(dob) {
    let today = new Date();

    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();

    if (days < 0) {
        months--;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    document.getElementById("ageResult").innerHTML =
        "Your Age: " + years + " Years " + months + " Months " + days + " Days";
}

function showDaysSurvived(dob) {
    let now = new Date();
    let diff = now - dob;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("daysSurvived").innerHTML =
        "You Survived: " + days + " Days";
}

function startLiveTimer(dob) {
    setInterval(() => {
        let now = new Date();
        let diff = now - dob;

        let hours = Math.floor(diff / (1000 * 60 * 60));
        let minutes = Math.floor(diff / (1000 * 60)) % 60;
        let seconds = Math.floor(diff / 1000) % 60;

        document.getElementById("liveTimer").innerHTML =
            "Live Time: " + hours + "h : " + minutes + "m : " + seconds + "s";
    }, 1000);
}

function birthdayWish(dob) {
    let today = new Date();
    if (today.getDate() === dob.getDate() && today.getMonth() === dob.getMonth()) {
        document.getElementById("wish").innerHTML =
            "🎉 Happiest Birthday to You 🎉";
    }
}

function generateCalendar(month, birthday) {
    let year = new Date().getFullYear();
    let firstDay = new Date(year, month, 1).getDay();
    let daysInMonth = new Date(year, month + 1, 0).getDate();

    let table = "<table><tr>";
    let days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    for (let d of days) table += "<th>" + d + "</th>";
    table += "</tr><tr>";

    for (let i = 0; i < firstDay; i++) table += "<td></td>";

    for (let day = 1; day <= daysInMonth; day++) {
        if ((firstDay + day - 1) % 7 === 0) table += "</tr><tr>";

        if (day === birthday)
            table += "<td class='highlight'>" + day + "</td>";
        else
            table += "<td>" + day + "</td>";
    }

    table += "</tr></table>";

    document.getElementById("calendar").innerHTML = table;
}

/* BACK BUTTON FUNCTION */
function goBack() {
    document.getElementById("calendarPage").style.display = "none";
    document.getElementById("loginPage").style.display = "block";
}

</script>

</body>
</html>
